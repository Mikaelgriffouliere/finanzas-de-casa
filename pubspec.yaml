name: finanzas_hogar
description: "Finanzas Hogar - Administración de finanzas personales y familiares"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0+3
  path: ^1.9.1

  # Characters
  characters: ^1.4.0

  # State Management
  provider: ^6.1.3

  # UI / Charts
  fl_chart: ^0.70.2
  table_calendar: ^3.2.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # Backup
  csv: ^5.1.1
  share_plus: ^10.1.4
  path_provider: ^2.1.6

  # Seguridad
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Selección de archivos (avatar/foto)
  file_picker: ^8.3.7
  pdf: ^3.12.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#4F5CD3"
  adaptive_icon_foreground: assets/icon/icon.png

flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
